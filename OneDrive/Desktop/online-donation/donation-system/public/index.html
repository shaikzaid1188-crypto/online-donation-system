<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Donation Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌱 Samarpan Relief Foundation</a>
        <a class="btn btn-outline-light btn-sm" href="/admin.html">Admin Dashboard</a>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <!-- Active Campaigns -->
        <div class="col-lg-7">
            <h4 class="fw-bold mb-3">Active Causes</h4>
            <div id="campaignList" class="d-flex flex-column gap-3">
                <div class="text-secondary">Loading causes...</div>
            </div>
        </div>

        <!-- Donation Form -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
                <h4 class="fw-bold mb-3 text-primary">Make a Donation</h4>
                <div id="statusMessage"></div>
                
                <form id="donationForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Select Cause</label>
                        <select class="form-select" id="campaignSelect" required>
                            <option value="">Choose a campaign...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Amount (₹)</label>
                        <input type="number" class="form-control" id="amount" placeholder="e.g. 1000" min="10" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mobile Number</label>
                        <input type="tel" class="form-control" id="mobile" placeholder="10-digit number" pattern="[0-9]{10}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Payment Method</label>
                        <select class="form-select" id="paymentMethod">
                            <option value="upi">UPI / QR (GPay, PhonePe, Paytm)</option>
                            <option value="card">Debit / Credit Card</option>
                            <option value="netbanking">Net Banking</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Donate Now</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    async function fetchCampaigns() {
        const list = document.getElementById('campaignList');
        const select = document.getElementById('campaignSelect');
        
        try {
            const res = await fetch('/api/campaigns');
            const result = await res.json();
            
            console.log('Campaigns API response:', result);

            if (!result.data || result.data.length === 0) {
                list.innerHTML = '<p class="text-muted">No active campaigns found.</p>';
                return;
            }

            list.innerHTML = '';
            select.innerHTML = '<option value="">Choose a campaign...</option>';

            result.data.forEach(camp => {
                const pct = Math.min(Number(camp.progress_pct) || 0, 100);
                
                // Add campaign card
                const card = document.createElement('div');
                card.className = 'card p-4 shadow-sm border-0 rounded-3 bg-white';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="fw-bold mb-0">${camp.title}</h5>
                        <span class="badge bg-success-subtle text-success">${pct}%</span>
                    </div>
                    <p class="text-secondary small mb-3">${camp.description || ''}</p>
                    <div class="progress mb-2" style="height: 10px;">
                        <div class="progress-bar bg-primary" style="width: ${pct}%;"></div>
                    </div>
                    <div class="d-flex justify-content-between small text-muted">
                        <span>Raised: <strong>₹${Number(camp.raised_amount).toLocaleString('en-IN')}</strong></span>
                        <span>Target: <strong>₹${Number(camp.target_amount).toLocaleString('en-IN')}</strong></span>
                    </div>
                `;
                list.appendChild(card);

                // Add option to dropdown
                const opt = document.createElement('option');
                opt.value = camp.id;
                opt.textContent = camp.title;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error('Fetch error:', err);
            list.innerHTML = '<div class="alert alert-danger">Error fetching campaigns. Check browser console.</div>';
        }
    }

    document.getElementById('donationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            campaignId: document.getElementById('campaignSelect').value,
            amount: document.getElementById('amount').value,
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            mobile: document.getElementById('mobile').value,
            paymentMethod: document.getElementById('paymentMethod').value
        };

        const statusBox = document.getElementById('statusMessage');
        statusBox.innerHTML = '';

        try {
            const res = await fetch('/api/donations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                statusBox.innerHTML = `
                    <div class="alert alert-success border-0 shadow-sm">
                        <h6 class="fw-bold mb-1">Receipt Generated!</h6>
                        <small>Ref: <strong>${data.receipt.transactionId}</strong></small><br>
                        <small>Amount: <strong>₹${data.receipt.amount}</strong> on ${data.receipt.date}</small>
                    </div>
                `;
                document.getElementById('donationForm').reset();
                fetchCampaigns();
            } else {
                statusBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        } catch (err) {
            statusBox.innerHTML = `<div class="alert alert-danger">Error connecting to server.</div>`;
        }
    });

    // Run on load
    window.addEventListener('DOMContentLoaded', fetchCampaigns);
</script>
</body>
</html>
